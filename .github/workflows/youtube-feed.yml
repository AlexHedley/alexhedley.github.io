name: Update YouTube feed

on:
  schedule:
    - cron: "0 12 * * 6" # Saturdays at 12:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch YouTube feed
        run: |
          mkdir -p data
          python3 .github/scripts/fetch_youtube.py

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain data/youtube.json)" ]; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/youtube.json
          git commit -m "Update YouTube feed"
          git push
